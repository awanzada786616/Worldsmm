<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KingTube Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff0000; 
            --gold: #ffcc00;
            --bg-dark: #0a0a0a;
            --card-bg: #161616;
            --text-main: #ffffff;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-dark); color: var(--text-main); font-family: 'Poppins', sans-serif; overflow-x: hidden; }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease;
        }
        .splash-logo {
            font-family: 'Montserrat', sans-serif; font-size: 3.5rem; color: var(--gold);
            text-shadow: 0 0 30px rgba(255,204,0,0.4); animation: scaleUp 1s ease-in-out;
        }
        .splash-loader {
            width: 40px; height: 40px; border: 3px solid #333;
            border-top: 3px solid var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin-top: 20px;
        }

        /* --- HEADER & HIGH QUALITY SEARCH BAR --- */
        header {
            padding: 10px 4%; display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.9); border-bottom: 1px solid #333;
            position: sticky; top: 0; z-index: 1000; gap: 15px;
        }
        .logo-box { display: flex; align-items: center; gap: 8px; cursor: pointer; flex-shrink: 0; }
        .logo-box i { color: var(--gold); font-size: 1.6rem; }
        .logo-box span { font-weight: 800; font-size: 1.3rem; letter-spacing: -0.5px; }

        .search-wrapper { 
            flex: 1; max-width: 600px; position: relative; 
            display: flex; align-items: center;
        }
        .search-wrapper input {
            width: 100%; padding: 12px 45px 12px 20px; border-radius: 8px; border: 1px solid #333;
            background: #111; color: white; outline: none; font-size: 14px;
            transition: 0.3s; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .search-wrapper input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(255,0,0,0.3); }
        .search-wrapper .search-btn {
            position: absolute; right: 10px; background: none; border: none; 
            color: #777; cursor: pointer; font-size: 1.1rem; transition: 0.3s;
        }
        .search-wrapper .search-btn:hover { color: var(--primary); }

        /* --- SIDE MENU --- */
        .menu-toggle { font-size: 1.4rem; cursor: pointer; color: var(--gold); }
        #sidebar {
            position: fixed; top: 0; left: -300px; width: 280px; height: 100%;
            background: #0f0f0f; z-index: 2000; transition: 0.4s; padding: 30px 20px;
            box-shadow: 15px 0 40px rgba(0,0,0,0.8);
        }
        #sidebar.active { left: 0; }
        .side-title { color: var(--gold); font-size: 1.5rem; font-weight: 800; margin-bottom: 30px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .side-link { 
            padding: 14px 18px; display: flex; align-items: center; gap: 15px; 
            text-decoration: none; color: #ccc; border-radius: 8px; margin-bottom: 8px; transition: 0.3s;
            font-weight: 500;
        }
        .side-link:hover { background: #222; color: #fff; transform: translateX(5px); }
        .side-link i { width: 20px; text-align: center; color: var(--primary); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 1500; }

        /* --- MAIN LAYOUT --- */
        .app-container { padding: 20px 4%; display: flex; flex-direction: row; gap: 25px; }
        #main-view { flex: 1; }
        #side-view { width: 350px; }

        /* --- CARDS & GRID --- */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .king-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 1px solid #222; }
        .king-card:hover { border-color: #444; transform: translateY(-5px); }
        .king-thumb { width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
        .king-thumb img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .king-card:hover .king-thumb img { transform: scale(1.05); }
        .king-info { padding: 12px; }
        .king-title { font-size: 14px; font-weight: 600; line-height: 1.3; height: 38px; overflow: hidden; margin-bottom: 8px; }
        .king-meta { font-size: 12px; color: #888; display: flex; align-items: center; gap: 5px; }

        /* --- PLAYER --- */
        .player-box { width: 100%; background: #000; border-radius: 15px; overflow: hidden; aspect-ratio: 16/9; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        iframe { width: 100%; height: 100%; border: none; }

        /* --- WHATSAPP DIALOG --- */
        #wa-popup {
            position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%);
            background: white; color: black; padding: 25px; border-radius: 20px 20px 0 0;
            width: 100%; max-width: 450px; z-index: 3000; text-align: center; box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #wa-popup.show { bottom: 0; }
        .wa-confirm-btn { background: #25d366; color: white; padding: 12px 30px; border-radius: 50px; text-decoration: none; display: inline-block; font-weight: 700; margin-top: 15px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes scaleUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        @media (max-width: 900px) {
            .app-container { flex-direction: column; }
            #side-view { width: 100%; }
            header { padding: 10px 15px; }
            .logo-box span { display: none; }
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-logo"><i class="fas fa-crown"></i> KINGTUBE</div>
        <div class="splash-loader"></div>
    </div>

    <!-- Sidebar -->
    <div class="overlay" onclick="toggleMenu()"></div>
    <div id="sidebar">
        <div class="side-title">KINGTUBE</div>
        <a href="#" class="side-link" onclick="location.reload()"><i class="fas fa-home"></i> Home</a>
        <a href="https://chat.whatsapp.com/EZhxFOubSr4IWqANqsi2AL" target="_blank" class="side-link"><i class="fab fa-whatsapp"></i> Join WhatsApp Group</a>
        <!-- Contact Developer Button -->
        <a href="https://wa.me/923012709322" target="_blank" class="side-link" style="background: rgba(255,204,0,0.1); border: 1px solid var(--gold);"><i class="fas fa-headset"></i> Contact Developer</a>
        <a href="#" class="side-link"><i class="fas fa-heart"></i> Favorites</a>
        <a href="#" class="side-link"><i class="fas fa-history"></i> Watch History</a>
    </div>

    <!-- Header -->
    <header>
        <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        
        <div class="logo-box" onclick="location.reload()">
            <i class="fas fa-crown"></i>
            <span>KING<span style="color:var(--primary)">TUBE</span></span>
        </div>

        <div class="search-wrapper">
            <input type="text" id="search-input" placeholder="Search movies, series, videos...">
            <button class="search-btn" onclick="triggerSearch()"><i class="fas fa-search"></i></button>
        </div>

        <div style="width: 40px; text-align: right;"><i class="fas fa-user-circle" style="font-size: 1.5rem; color: #555;"></i></div>
    </header>

    <!-- Main Content -->
    <div class="app-container">
        <main id="main-view"></main>
        <aside id="side-view"></aside>
    </div>

    <!-- WhatsApp Popup -->
    <div id="wa-popup">
        <i class="fab fa-whatsapp" style="font-size: 3.5rem; color: #25d366;"></i>
        <h2 style="margin-top: 10px;">KingTube Community</h2>
        <p style="color: #666; margin-top: 5px;">Latest Hollywood Movies aur Updates ke liye hamara group join karen.</p>
        <a href="https://chat.whatsapp.com/EZhxFOubSr4IWqANqsi2AL" class="wa-btn wa-confirm-btn">JOIN GROUP NOW</a>
        <br>
        <button onclick="closePopup()" style="margin-top: 15px; border: none; background: none; color: #aaa; cursor: pointer; font-weight: 600;">CLOSE</button>
    </div>

    <script>
        const API_NODES = [
            "https://api.piped.private.coffee",
            "https://pipedapi.mha.fi",
            "https://inv.nadeko.net"
        ];

        // UI Controls
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            const display = document.getElementById('sidebar').classList.contains('active') ? 'block' : 'none';
            document.querySelector('.overlay').style.display = display;
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('splash-screen').style.display = 'none', 800);
                // Show Popup
                setTimeout(() => document.getElementById('wa-popup').classList.add('show'), 6000);
            }, 2000);
            renderHome();
        });

        function closePopup() { document.getElementById('wa-popup').classList.remove('show'); }

        // Search Logic
        function triggerSearch() {
            const q = document.getElementById('search-input').value;
            if(q) renderGrid(q);
        }

        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') triggerSearch();
        });

        // Data Fetching
        async function searchVideos(query) {
            for (let node of API_NODES) {
                try {
                    const res = await fetch(`${node}/search?q=${encodeURIComponent(query)}&filter=videos`);
                    const data = await res.json();
                    return data.items.map(v => ({
                        id: v.url.split('v=')[1] || v.videoId,
                        title: v.title,
                        thumb: `https://i.ytimg.com/vi/${v.url.split('v=')[1] || v.videoId}/mqdefault.jpg`,
                        author: v.uploaderName
                    }));
                } catch (e) { continue; }
            }
            return [];
        }

        async function renderHome() {
            renderGrid("new hollywood movies hindi dubbed 2024 full movie");
        }

        async function renderGrid(query) {
            const main = document.getElementById('main-view');
            main.innerHTML = '<div style="text-align:center; padding:100px;"><div class="splash-loader" style="margin:auto;"></div></div>';
            
            const videos = await searchVideos(query);
            let html = `<h2 style="margin-bottom:20px; font-weight:800; letter-spacing:-1px;">Trending in "${query}"</h2><div class="video-grid">`;
            videos.forEach(v => {
                html += `
                    <div class="king-card" onclick="playKingVideo('${v.id}', '${v.title.replace(/'/g, "")}', '${v.author}')">
                        <div class="king-thumb"><img src="${v.thumb}" loading="lazy"></div>
                        <div class="king-info">
                            <div class="king-title">${v.title}</div>
                            <div class="king-meta"><i class="fas fa-check-circle" style="color:var(--gold)"></i> ${v.author}</div>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            main.innerHTML = html;
        }

        async function playKingVideo(id, title, author) {
            const main = document.getElementById('main-view');
            const side = document.getElementById('side-view');
            window.scrollTo({top: 0, behavior: 'smooth'});

            main.innerHTML = `
                <div class="player-box">
                    <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; fullscreen" allowfullscreen></iframe>
                </div>
                <h1 style="margin: 20px 0 10px 0; font-size: 1.4rem; line-height:1.2;">${title}</h1>
                <div style="display:flex; align-items:center; justify-content:space-between; padding-bottom:20px; border-bottom:1px solid #222;">
                    <div style="font-weight:bold; color:var(--gold);"><i class="fas fa-user-circle"></i> ${author}</div>
                    <div style="display:flex; gap:15px;">
                        <span style="cursor:pointer; background:#222; padding:8px 15px; border-radius:5px; font-size:14px;"><i class="fas fa-thumbs-up"></i> Like</span>
                        <span onclick="window.open('https://wa.me/?text=Watch this: ${title} - https://www.youtube.com/watch?v=${id}')" style="cursor:pointer; background:#222; padding:8px 15px; border-radius:5px; font-size:14px;"><i class="fas fa-share"></i> Share</span>
                    </div>
                </div>
            `;

            // Sidebar Suggestions
            const related = await searchVideos(author);
            let sHtml = `<h3 style="margin-bottom:15px; font-weight:800;">Related for You</h3>`;
            related.slice(0, 12).forEach(v => {
                sHtml += `
                    <div class="king-card" style="display:flex; margin-bottom:12px; gap:12px; background:none; border:none;" onclick="playKingVideo('${v.id}', '${v.title.replace(/'/g, "")}', '${v.author}')">
                        <div class="king-thumb" style="width:140px; height:80px; flex-shrink:0; border-radius:8px;"><img src="${v.thumb}"></div>
                        <div style="padding-top:5px;">
                            <div class="king-title" style="font-size:12px; height:32px; margin-bottom:4px;">${v.title}</div>
                            <div class="king-meta" style="font-size:10px;">${v.author}</div>
                        </div>
                    </div>
                `;
            });
            side.innerHTML = sHtml;
        }
    </script>
</body>
</html>
